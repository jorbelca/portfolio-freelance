name: portfolio-11
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      N8N_URL: http://n8n:5678
    ports:
      - "127.0.0.1:${PORT:-3210}:${PORT:-3210}"
    volumes:
      - ./reports:/app/reports
      - ${HOME}/.codex/auth.json:/home/node/.codex/auth.json:ro
      - ${HOME}/.codex/models_cache.json:/home/node/.codex/models_cache.json:ro
    depends_on:
      - n8n
  n8n:
    image: n8nio/n8n@sha256:f5140088385af2d4e681e177d8264bcb41e8fe126062030c5c65cd8f3e1605e1
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
volumes:
  n8n_data:
