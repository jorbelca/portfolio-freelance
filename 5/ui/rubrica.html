<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rúbrica de cualificación · Demo 5</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#16191d;--dim:#697280;--line:#e4e7eb;--accent:#2563eb;
        --radius:12px;--shadow:0 1px 2px rgba(20,25,35,.04),0 4px 16px rgba(20,25,35,.05)}
  *{box-sizing:border-box;margin:0}
  html{font-size:15px}
  body{background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
       font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .page{max-width:860px;margin:0 auto;padding:28px 24px 80px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
  header h1{font-size:19px;font-weight:680;letter-spacing:-.01em}
  header p{color:var(--dim);font-size:13.5px;margin-top:4px}
  .btn.link{font:inherit;font-size:13.5px;font-weight:600;background:none;border:0;color:var(--accent);
            text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 10px}
  .ver{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;
       color:#4338ca;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:2px 10px;
       margin-left:8px;vertical-align:2px}
  .doc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
       box-shadow:var(--shadow);padding:34px 40px}
  .doc h1{font-size:23px;margin:0 0 14px;letter-spacing:-.01em}
  .doc h2{font-size:17px;margin:30px 0 10px;padding-top:18px;border-top:1px solid var(--line)}
  .doc h3{font-size:14.5px;margin:20px 0 6px}
  .doc p{margin:10px 0;color:#333941}
  .doc ul{margin:10px 0 10px 20px;color:#333941}
  .doc li{margin:4px 0}
  .doc code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#f1f2f4;
            border-radius:4px;padding:1px 5px}
  .doc table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
  .doc th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
          font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
  .doc td{padding:9px 10px;border-bottom:1px solid #f0f1f3;vertical-align:top}
  .doc tr.hl td{background:#fff7ec}
  .doc tr.hl td:first-child{box-shadow:inset 3px 0 0 #c2680a;font-weight:700}
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1>Rúbrica de cualificación<span class="ver" id="ver">—</span></h1>
      <p>El criterio que aplica el pipeline, versionado en el repo (<code>rubrica-cualificacion-leads.md</code>).</p>
    </div>
    <a class="btn link" href="/">← Tablero</a>
  </header>
  <div class="doc" id="doc">cargando…</div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// Markdown mínimo: encabezados, tablas, listas, `code`, **negrita**. Sin dependencias.
// ponytail: subset suficiente para ESTE fichero; si la rúbrica usa más sintaxis, ampliar aquí.
function md2html(src){
  const inline = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>')
                            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  const celdas = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  const out = []; const L = src.split('\n');
  for(let i = 0; i < L.length; i++){
    const l = L[i];
    if(/^\|/.test(l) && /^\|[\s:|-]+\|?$/.test(L[i+1] || '')){
      const cab = celdas(l); const filas = [];
      i += 2;
      while(i < L.length && /^\|/.test(L[i])){ filas.push(celdas(L[i])); i++; }
      i--;
      out.push(`<table><thead><tr>${cab.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${
        filas.map(f => `<tr${/\bR13\b/.test(f[0]||'') ? ' class="hl"' : ''}>${
          f.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if(h){ out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if(/^[-*]\s+/.test(l)){
      const items = [];
      while(i < L.length && /^[-*]\s+/.test(L[i])){ items.push(L[i].replace(/^[-*]\s+/, '')); i++; }
      i--;
      out.push(`<ul>${items.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>`);
      continue;
    }
    if(l.trim() && !/^---/.test(l)) out.push(`<p>${inline(l)}</p>`);
  }
  return out.join('');
}

(async () => {
  try{
    const txt = await (await fetch('/api/rubrica')).text();
    document.querySelector('#doc').innerHTML = md2html(txt);
    // la versión vigente es la de la cabecera, no el primer "v0.x" del historial de cambios
    const v = txt.match(/\*\*Versión:\*\*\s*([\d.]+)/);
    if(v) document.querySelector('#ver').textContent = 'v' + v[1];
  }catch(e){ document.querySelector('#doc').textContent = 'no se pudo cargar la rúbrica'; }
})();
</script>
</body>
</html>
